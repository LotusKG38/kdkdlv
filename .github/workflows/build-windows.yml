# Builds the Kingdom Come: Together installer on a GitHub-hosted Windows runner,
# so a player can download it from the browser without a local toolchain.
# The result is an UNSIGNED release candidate (tools\Build-Installer.ps1 -ReleaseCandidate).
name: Build Windows installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make sure Inno Setup 6 is present
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer (release candidate, unsigned)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\Build-Installer.ps1 -ReleaseCandidate

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingdomComeTogether-Setup
          path: |
            release/KingdomComeTogether-Setup-*.exe
            release/BUILD-*.log
            release/RELEASE-CANDIDATE-*.txt
          if-no-files-found: warn

      - name: Pack the installer into a zip
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          "ZIP_NAME=KingdomComeTogether-$version.zip" >> $env:GITHUB_ENV
          "KCT_VERSION=$version" >> $env:GITHUB_ENV
          Compress-Archive -Path "release\KingdomComeTogether-Setup-$version.exe" -DestinationPath "KingdomComeTogether-$version.zip" -Force
          Copy-Item "KingdomComeTogether-$version.zip" "KingdomComeTogether.zip"

      # One download link for everyone (once the repository is public):
      # https://github.com/<owner>/<repo>/releases/latest/download/KingdomComeTogether.zip
      - name: Publish the zip as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KCT_VERSION }}
          name: Kingdom Come Together ${{ env.KCT_VERSION }} (unsigned test build)
          make_latest: true
          overwrite_files: true
          files: |
            ${{ env.ZIP_NAME }}
            KingdomComeTogether.zip
          body: |
            Unofficial co-op mod for Kingdom Come: Deliverance II, built from the source of
            https://github.com/DeepFriedDepp/KingdomCome-Together (GPLv3). Not affiliated with Warhorse Studios or PLAION.

            Install: download the zip, extract it, run KingdomComeTogether-Setup-${{ env.KCT_VERSION }}.exe.
            The installer is unsigned: Windows SmartScreen shows "More info" -> "Run anyway".
            This is the maintainer's release candidate, not tested with two real players yet.
